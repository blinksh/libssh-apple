name: CI

on:
  push:
    tags:
    - 'v*'

jobs:
  build:
    name: Building release assets
    runs-on: macos-14
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: cmake install
      uses: jwlawson/actions-setup-cmake@v1.12
      with:
        cmake-version: '3.22.2'

    - name: install abimap
      run: sudo pip3 install abimap

    - name: build-libssh
      run: swift run

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body_path: release.md
        draft: false
        prerelease: false
        files: |
          ./LibSSH-dynamic.xcframework.zip
          ./LibSSH-static.xcframework.zip
